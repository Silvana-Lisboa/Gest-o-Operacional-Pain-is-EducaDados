<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EducaDados · Gestão Integrada V9.12</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#eef3f7}header{height:52px;background:#103b5c;color:white;display:flex;align-items:center;gap:12px;padding:0 14px}header strong{margin-right:auto;font-size:15px}button{background:#ffffff1c;color:white;border:1px solid #ffffff55;padding:8px 13px;border-radius:6px;cursor:pointer;font-weight:600}button.active{background:white;color:#103b5c}#status{font-size:11px;opacity:.9}main{height:calc(100vh - 52px)}iframe{width:100%;height:100%;border:0;display:none;background:white}iframe.active{display:block} @media(max-width:700px){header{gap:5px;padding:5px}header strong{font-size:12px}button{padding:7px;font-size:11px}#status{display:none}}
</style></head><body><header><strong>EducaDados · Demonstração pública V9.12</strong><button id="operacional" class="active">Gestão Operacional</button><button id="visual">Gestão Visual</button><span id="status">Inicializando…</span></header><main><iframe id="frame-operacional" class="active" src="index.html" title="Gestão Operacional"></iframe><iframe id="frame-visual" src="gestao-visual.html" title="Gestão Visual"></iframe></main><script>
(()=>{'use strict';const STORAGE='educadados-demo-publica-completa-20261125-integrado';const frames={operacional:document.getElementById('frame-operacional'),visual:document.getElementById('frame-visual')};let canonical=null,ready=new Set(),revision=0;
try{canonical=JSON.parse(localStorage.getItem(STORAGE));if(!canonical?.panels?.length)canonical=null}catch(_){}
const status=document.getElementById('status');function switchTo(page){if(!frames[page])return;for(const [k,f]of Object.entries(frames)){f.classList.toggle('active',k===page);document.getElementById(k).classList.toggle('active',k===page)}if(canonical)frames[page].contentWindow.postMessage({app:'educadados',type:'sync',payload:canonical,revision},'*');}
function commit(payload,origin){if(!payload||!Array.isArray(payload.panels)||!payload.panels.length)return;canonical=payload;revision++;try{localStorage.setItem(STORAGE,JSON.stringify(canonical))}catch(_){status.textContent='Dados nesta sessão · exporte backup JSON'}for(const [k,f]of Object.entries(frames))if(k!==origin&&ready.has(k))f.contentWindow.postMessage({app:'educadados',type:'sync',payload:canonical,revision},'*');status.textContent='Base compartilhada · '+canonical.panels.length+' versões';}
window.addEventListener('message',e=>{const m=e.data;if(!m||m.app!=='educadados')return;const source=Object.keys(frames).find(k=>frames[k].contentWindow===e.source);if(!source)return;if(m.type==='navigate'){switchTo(m.page);return}if(m.type==='ready'){ready.add(source);if(canonical)frames[source].contentWindow.postMessage({app:'educadados',type:'sync',payload:canonical,revision},'*');else if(source==='operacional')frames[source].contentWindow.postMessage({app:'educadados',type:'snapshot-request'},'*');return}if(m.type==='snapshot'){if(!canonical&&source==='operacional')commit(m.payload,'operacional');return}if(m.type==='save'){commit(m.payload,source);return}});
for(const k of Object.keys(frames))document.getElementById(k).onclick=()=>switchTo(k);
window.addEventListener('beforeunload',()=>{if(canonical)try{localStorage.setItem(STORAGE,JSON.stringify(canonical))}catch(_){}});
})();</script></body></html>
